name: Docs Guard

on:
  pull_request:
    paths:
      - "README.md"
      - "CHANGELOG.md"
      - "scripts/check-docs.sh"
  push:
    branches: ["main"]
    paths:
      - "README.md"
      - "CHANGELOG.md"
      - "scripts/check-docs.sh"

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run docs check
        run: bash scripts/check-docs.sh
